aid: repacket
name: Repacket
description: 'Repacket is an AI-native Secure Web Gateway (SWG) that makes endpoint
  security simple by blocking the majority of online threats by default. It protects
  organizations from phishing, malware, and sensitive-data leaks while giving teams
  visibility and control over AI usage and file uploads. Repacket runs as a managed
  client on Windows and macOS (deployable via MDM such as Intune, Jamf, and Kandji)
  and enforces traffic policy through modules for content filtering, data loss prevention
  (DLP), firewall/category access control, app discovery, phishing and session protection,
  just-in-time exceptions, and audit logging. Policy is expressed through a Protocol
  Buffers configuration schema. Backed by Initialized Capital.'
